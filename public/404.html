<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HerbScan - Redirecting</title>
  <style>
    body {
      background-color: #0e1713;
      color: #34d399;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(52, 211, 153, 0.2);
      border-top-color: #34d399;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    a {
      color: #6ee7b7;
      text-decoration: underline;
    }
  </style>
  <script>
    // GitHub Pages 404 handler: redirect to /HerbScan/
    (function() {
      var currentPath = window.location.pathname;
      var target = '/HerbScan/';
      if (!currentPath.startsWith('/HerbScan')) {
        window.location.replace(target + window.location.search + window.location.hash);
      } else {
        window.location.replace('/HerbScan/' + window.location.search + window.location.hash);
      }
    })();
  </script>
</head>
<body>
  <div class="spinner"></div>
  <h2>Redirecting to HerbScan...</h2>
  <p>If you are not redirected in a few seconds, <a href="/HerbScan/">click here to open HerbScan</a>.</p>
</body>
</html>
